# Render Blueprint: one web service serves the API (/api) and the built frontend.
# In Render: New → Blueprint → pick this repo. DATABASE_URL is asked for on first deploy
# (use the same Neon connection string as Wordle Unlimited).
services:
  - type: web
    name: lingora
    runtime: node
    plan: free
    # Dev packages (Vite, TypeScript) are needed to build, even if NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Optional: turns on the AI conversation partner (console.anthropic.com → API keys).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: GIF search in chats (use the same key as Wordle Unlimited).
      - key: GIPHY_API_KEY
        sync: false
      # Optional: where Banter and Wordle Unlimited live, for "Open in Banter" links and invite
      # cards. Defaults to the current onrender.com addresses.
      - key: BANTER_URL
        sync: false
      - key: WORDLE_URL
        sync: false
      # Optional: push notifications. The same three values as Banter and Wordle Unlimited.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
